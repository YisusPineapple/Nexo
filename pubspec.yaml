name: nexo
description: >-
  An oasis of local music for older hardware. Nexo offers a responsive
  interface, smooth transitions, and extreme optimization for devices
  with limited resources. FOSS & AI-Maintained.
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.4.9

dependencies:
  flutter:
    sdk: flutter
  audio_metadata_reader: ^1.7.0
  drift: ^2.34.3
  image: ^4.9.1
  path: ^1.9.1
  sqlite3: ^3.5.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_windows_audio: ^1.0.9
  file_picker: ^11.0.3

flutter:
  uses-material-design: true