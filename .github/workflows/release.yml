name: Nexo Official Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    name: Build Android APKs
    needs: quality-gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Validate release signing inputs and create key.properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

          rm -f android/app/nexo-release.jks

          if ! printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android/app/nexo-release.jks 2>/dev/null; then
            echo "::error::Failed to decode RELEASE_KEYSTORE_BASE64"
            rm -f android/app/nexo-release.jks
            exit 1
          fi

          if [ ! -s android/app/nexo-release.jks ]; then
            echo "::error::Decoded keystore is empty"
            rm -f android/app/nexo-release.jks
            exit 1
          fi

          # Validate keystore integrity and alias existence
          if ! keytool -list -keystore android/app/nexo-release.jks -storepass:env RELEASE_KEYSTORE_PASSWORD -alias "$RELEASE_KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore validation failed: Invalid password or alias not found."
            rm -f android/app/nexo-release.jks
            exit 1
          fi

          cat <<EOF > android/key.properties
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyPassword=$RELEASE_KEY_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          storeFile=app/nexo-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Build Split APKs (per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Cleanup sensitive files
        if: always()
        run: rm -f android/app/nexo-release.jks android/key.properties

  build-linux:
    name: Build Linux Binary
    needs: quality-gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Compress Linux Build
        run: tar -czvf nexo-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexo-linux-x64.tar.gz

  build-windows:
    name: Build Windows EXE
    needs: quality-gate
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath nexo-windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: nexo-windows-x64.zip
